[package]
name = "planejei"
version = "0.1.0"
edition = "2024"
description = "Planejei — projeto de móveis planejados com plano de corte e orçamento"
license = "GPL-3.0-or-later"
authors = ["Lucas Bernardo"]

[dependencies]
base64 = "0.22"
bytemuck = { version = "1.25.2", features = ["derive"] }
earcutr = "0.5"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
env_logger = "0.11.11"
glam = { version = "0.34.3", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
png = "0.18"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slotmap = "1.1"

[build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
