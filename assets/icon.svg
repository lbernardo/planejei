<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Planejei: um "P" montado com dois módulos de marcenaria (torre em madeira e aéreo branco)
       sobre uma chapa com as linhas do plano de corte, e a cota da largura embaixo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3f66"/>
      <stop offset="1" stop-color="#0f1828"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc184"/>
      <stop offset="1" stop-color="#c48a4a"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ec"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Placa -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#tile)" stroke="#6fa8ff" stroke-opacity=".16" stroke-width="5" fill="none">
    <!-- linhas de corte da chapa -->
    <path d="M100 330 H924 M100 610 H924 M380 100 V924 M660 330 V610 M780 610 V924 M220 610 V924"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <g filter="url(#shadow)">
    <!-- Torre (haste do P) -->
    <rect x="292" y="236" width="196" height="560" rx="22" fill="url(#wood)"/>
    <!-- porta em cima, duas gavetas embaixo -->
    <g stroke="#7a4c1c" stroke-opacity=".28" stroke-width="3" fill="none">
      <path d="M318 270 C340 330 330 420 344 520 M392 262 C404 330 396 430 410 520"/>
    </g>
    <path d="M292 548 H488 M292 672 H488" stroke="#8a5a26" stroke-width="7" stroke-opacity=".6"/>
    <rect x="452" y="410" width="14" height="96" rx="7" fill="#3a2612" fill-opacity=".75"/>
    <rect x="350" y="600" width="80" height="14" rx="7" fill="#3a2612" fill-opacity=".75"/>
    <rect x="350" y="724" width="80" height="14" rx="7" fill="#3a2612" fill-opacity=".75"/>

    <!-- Aéreo (barriga do P) -->
    <path d="M528 236 H612 A124 124 0 0 1 736 360 V384 A124 124 0 0 1 612 508 H528 A22 22 0 0 1 506 486 V258 A22 22 0 0 1 528 236 Z" fill="url(#white)"/>
    <path d="M610 236 V508" stroke="#9aa6b8" stroke-width="6" stroke-opacity=".7"/>
    <rect x="580" y="330" width="14" height="80" rx="7" fill="#2b3547" fill-opacity=".8"/>
    <rect x="626" y="330" width="14" height="80" rx="7" fill="#2b3547" fill-opacity=".8"/>
  </g>

  <!-- Cota -->
  <g stroke="#4c9bff" stroke-width="10" stroke-linecap="round">
    <path d="M292 852 H736"/>
    <path d="M292 826 V878 M736 826 V878"/>
  </g>
</svg>
